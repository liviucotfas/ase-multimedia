<!--- Assignment
1. Compare the histogram for the same image in Adobe Photoshop or on https://www.dcode.fr/image-histogram.
   Check the channel or intensity definition, transparency handling, and chart scaling;
   these may differ between tools, so the plots need not match.
2. Allow the user to drop the image only in specific area of the page (ex: on a div)
3. Provide a visual cue when the user is dragging a file over the div added above (hint: use the events exposed by the API https://developer.mozilla.org/en-US/docs/Web/API/HTML_Drag_and_Drop_API).
4. Change the color of the histogram to black: rgba(0,0,0,0.8)
5. Also display the histogram for the red channel using as color rgba(255,0,0,0.8)
6. Also display the histogram for the green channel using as color rgba(0,255,0,0.8)
7. Also display the histogram for the blue channel using as color rgba(0,0,255,0.8)
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image histogram</title>
    <style>
        body {
            max-width: 960px;
            margin: 32px auto;
            padding: 0 20px;
            font: 16px/1.5 system-ui, sans-serif;
        }
        .results { display: flex; flex-wrap: wrap; gap: 24px; }
        figure {
            flex-grow: 1; /* Share extra space equally between the figures. */
            flex-basis: 300px; /* Starting width before growing or shrinking. */
            margin: 0;
        }
        figcaption { margin-bottom: 12px; }
        canvas {
            display: block;
            width: 100%;
            height: 240px;
            background: #f3f5f7;
        }
        #image-canvas { object-fit: scale-down; }
    </style>
</head>
<body>
    <main>
        <h1>Image histogram</h1>

        <div class="results">
            <figure>
                <figcaption>Image</figcaption>
                <canvas id="image-canvas">
                    Your browser does not support the HTML canvas element.
                </canvas>
            </figure>
            <figure>
                <figcaption>Intensity histogram</figcaption>
                <canvas id="histogram-canvas" width="512" height="240">
                    Your browser does not support the HTML canvas element.
                </canvas>
            </figure>
        </div>
    </main>

    <script type="module">
        import { BarChart } from './canvas-bar-chart-library.js';

        //Selectors
        const imageCanvas = /** @type {HTMLCanvasElement} */ (document.getElementById('image-canvas'));
        const histogramCanvas = /** @type {HTMLCanvasElement} */ (document.getElementById('histogram-canvas'));
        const barChart = new BarChart(histogramCanvas);

        //Methods
        /**
         * Draws the image at its natural dimensions.
         * @param {HTMLImageElement} image - The loaded image to draw.
         * @returns {void}
         */
        function drawImage(image) {
            // resize the canvas
            imageCanvas.width = image.naturalWidth;
            imageCanvas.height = image.naturalHeight;
            // CSS scales only the preview; the histogram still counts the original pixels.
           
            const context = imageCanvas.getContext('2d');
            context.drawImage(image, 0, 0);
        }

        /**
         * Counts pixels by the rounded arithmetic mean of the RGB channels (0-255).
         * This simple intensity measure is a teaching simplification, not perceptual luminance.
         * Alpha is ignored: every pixel counts once using the RGB values returned by
         * getImageData(), including partially and fully transparent pixels.
         * @param {ImageData} imageData - The RGBA pixels to count.
         * @returns {number[]} The 256 intensity bins, each containing a pixel count.
         */
        function calculateHistogram(imageData) {

            //Create an array of 256 elements, each initialized with 0
            // 1) Using the fill() method
            const bins = new Array(256).fill(0);
            // 2) Using a for loop
            // const bins = [];
            // for (let i = 0; i < 256; i++) {
            //     //The push() method adds new items to the end of an array, and returns the new length.
            //     // http://www.w3schools.com/jsref/jsref_push.asp
            //     bins.push(0);
            // }

            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;

            for (let y = 0; y < height; y++) { //each line
                for (let x = 0; x < width; x++) { //each column
                    
                    const offset = ((width * y) + x) * 4;

                    const red = data[offset];
                    const green = data[offset + 1];
                    const blue = data[offset + 2];

                    const intensity = Math.round((red + green + blue) / 3);

                    bins[intensity]++;
                }
            }

            return bins;
        }

        /**
         * Reads the image canvas pixels, counts their intensities, and draws the histogram.
         * @returns {void}
         */
        function drawImageHistogram() {
            const context = imageCanvas.getContext('2d');
            const imageData = context.getImageData(0, 0, imageCanvas.width, imageCanvas.height);
            const bins = calculateHistogram(imageData);

            barChart.draw(bins);
        }

        //Events
        // According to https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/dragover_event#examples: "in the dragover event handler for the target container, we call event.preventDefault(), which enables it to receive drop events."  
        document.addEventListener('dragover', function(e){
            // prevent default to allow drop
            e.preventDefault();
        });
        document.addEventListener('drop', function (e) {
            // prevent default action (open as link for some elements)
            e.preventDefault();

            // Access the first file in the drop event's DataTransfer object.
            const file = e.dataTransfer.files[0];
            
            // Ignore drops that do not contain a file, such as text.
            if (file) {
                //The FileReader object lets web applications asynchronously read the contents of files (or raw data buffers) stored on the user's computer, using File or Blob objects to specify the file or data to read
                //https://developer.mozilla.org/en/docs/Web/API/FileReader
                const reader = new FileReader();

                // An alternative would be to use await window.createImageBitmap(file), which can than be written on the canvas using drawImage().

                //FileReader.onload: a handler for the load event. This event is triggered each time the reading operation is successfully completed.
                //https://developer.mozilla.org/en-US/docs/Web/API/FileReader/onload
                reader.addEventListener('load', function () {
                    const image = document.createElement('img');
                    image.addEventListener('load', function(){
                        drawImage(image); //"this" can also be used as a parameter
                        drawImageHistogram();
                    });
                    image.addEventListener('error', function () {
                        console.error('Could not open this image. Drop a supported image file.');
                    });
                    image.setAttribute('src', reader.result);
                });
                reader.addEventListener('error', function () {
                    console.error('Could not read this file. Try dropping it again.', reader.error);
                });

                //FileReader.readAsDataURL: starts reading the contents of the specified Blob, once finished, the result attribute contains a data: URL representing the file's data.
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
