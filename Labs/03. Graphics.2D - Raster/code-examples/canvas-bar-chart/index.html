<!-- Assignment
1. Display the corresponding value above each bar
2. Display the value using the black color (don't change the color of the bars)
3. Center the displayed values horizontally against the corresponding bar
Hint: use either the `measureText` method or `textAlign = "center"`
4. Increase the dimensions of the canvas in CSS (width and height) and observe whether the drawing quality changes. Analyze the cause and try to find a solution to preserve the drawing quality.
5. (optional) Try to make the chart responsive (change the number of pixels in the canvas when it is resized). 
6. (optional) Check http://www.chartjs.org/ and try to implement some of its features in the current example
-->

<!DOCTYPE html>
<html>

<head>
    <title>BarChart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <form id="chart-form">
    <input id="chart-values-input" type="text" value="12, 13, 3, 2, 1, 10, 7, 18">
    <button id="chart-draw-button" type="submit">Draw chart</button>
    </form>

    <canvas id="chart-canvas">
        Your browser does not support the canvas element. :(
    </canvas>
    <button id="chart-download-button">Download chart</button>

    <script type="module">
    import { BarChart } from './canvas-bar-chart-library.js';

    const chartCanvas = /** @type {HTMLCanvasElement} */ (document.getElementById('chart-canvas'));
    const chartForm = /** @type {HTMLFormElement} */ (document.getElementById('chart-form'));
    const chartDownloadButton = /** @type {HTMLButtonElement} */ (document.getElementById('chart-download-button'));
    const chartValuesInput = /** @type {HTMLInputElement} */ (document.getElementById('chart-values-input'));

    const barChart = new BarChart(chartCanvas);

        const options = {
            'drawOutline': true
        }

        chartForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const values = chartValuesInput.value;
            barChart.draw(values.split(',').map(Number), options);
        });

        //?After an event triggers on the deepest possible element, it then triggers on parents in nesting order
        //https://javascript.info/tutorial/bubbling-and-capturing
        /*chartCanvas.addEventListener('click', function () {
            this.parentNode.setAttribute('href', this.toDataURL('image/png'));
        });*/

        chartDownloadButton.addEventListener("click", (event) => {
            event.preventDefault();
            barChart.download();
        });
    
    </script>
</body>

</html>
