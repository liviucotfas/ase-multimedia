<!-- Assignment
1. Display the corresponding value above each bar
2. Display the value using the black color (don't change the color of the bars)
3. Center the displayed values horizontally against the corresponding bar
Hint: use either the `measureText` method or `textAlign = "center"`
4. Add a separate button (<button>) for downloading the bar chart
Hint: use an `<a>` element and simulate a `click` event
5. Măriți dimensiunile canvas-ului din css (width și height) și observați dacă se modifică calitatea desenării. Analizați cauza și încercați să găsiți o soluție pentru a păstra calitatea desenării.
6. (optional) Try to make the chart responsive (change the number of pixels in the canvas when it is resized). 
7. (optional) Check http://www.chartjs.org/ and try to implement some of its features in the current example
-->

<!DOCTYPE html>
<html>

<head>
    <title>BarChart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <form id="chart-form">
    <input id="chart-values-input" type="text" value="12, 13, 3, 2, 1, 10, 7, 18">
    <button id="chart-draw-button" type="submit">Draw chart</button>
    </form>

    Click on the bar chart to download it<br>
    <a id="chart-download-link" href="#" download="barchart">
        <canvas id="chart-canvas">
            Your browser does not support the canvas element. :(
        </canvas>
    </a>

    <script type="module">
    import { BarChart } from './canvas-bar-chart-library.js';

    const chartCanvas = /** @type {HTMLCanvasElement} */ (document.getElementById('chart-canvas'));
    const chartForm = /** @type {HTMLFormElement} */ (document.getElementById('chart-form'));
    const chartDownloadLink = /** @type {HTMLAnchorElement} */ (document.getElementById('chart-download-link'));
    const chartValuesInput = /** @type {HTMLInputElement} */ (document.getElementById('chart-values-input'));

    const barChart = new BarChart(chartCanvas);

        const options = {
            'drawOutline': true
        }

        chartForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const values = chartValuesInput.value;
            barChart.draw(values.split(',').map(Number), options);
        });

        //?After an event triggers on the deepest possible element, it then triggers on parents in nesting order
        //https://javascript.info/tutorial/bubbling-and-capturing
        /*chartCanvas.addEventListener('click', function () {
            this.parentNode.setAttribute('href', this.toDataURL('image/png'));
        });*/

        chartDownloadLink.addEventListener("click", (event) => {
            const dataUrl = chartCanvas.toDataURL('image/png')
            //Note: The currentTarget read-only property of the Event interface identifies the current target for the event, as the event traverses the DOM. It always refers to the element to which the event handler has been attached, as opposed to Event.target, which identifies the element on which the event occurred and which may be its descendant.
            const downloadLink = /** @type {HTMLAnchorElement} */ (event.currentTarget);
            downloadLink.href = dataUrl;
        });
    
    </script>
</body>

</html>
