<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Canvas - ImageData effects</title>
        <style>
            main {
                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
            }

            figure {
                margin: 0;
                max-width: 100%;
            }

            canvas {
                display: block;
                max-width: 100%;
                height: auto;
            }
        </style>
    </head>
    <body>
        <h1>Pixel effects with ImageData</h1>
        <p>Each effect starts with the same photograph and preserves its transparency.</p>
        <main>
            <figure>
                <figurecaption>Effect 1</figurecaption>
                <canvas id="canvas-1">
                    The photograph with brighter red, green, and blue channels.
                </canvas>
            </figure>
            <figure>
                <figurecaption>Effect 2</figurecaption>
                <canvas id="canvas-2">
                    The photograph converted to grayscale using weighted RGB values.
                </canvas>
            </figure>
        </main>

        <script>
            "use strict";

            const canvas1 = /** @type {HTMLCanvasElement} */ (document.getElementById("canvas-1"));
            const canvas2 = /** @type {HTMLCanvasElement} */ (document.getElementById("canvas-2"));

            const image = new Image();
            image.addEventListener("load", () => {
                renderEffect(canvas1, image, brighten);
                renderEffect(canvas2, image, weightedGrayscale);

                // Classroom alternatives: replace the first renderEffect() call
                // with one below, and update its caption and canvas description.
                // renderEffect(canvas1, image, keepRed);
                // renderEffect(canvas1, image, invertColors);
                // renderEffect(canvas1, image, averageGrayscale);
                // renderEffect(canvas1, image, threshold);
                // renderEffect(canvas1, image, sepia);
            });
            image.src = "photo-935x702.jpg";

            /**
             * Draws a fresh image, edits its pixels, and writes the result back.
             * @param {HTMLCanvasElement} canvas - Destination canvas.
             * @param {HTMLImageElement} image - Loaded and decoded source image.
             * @param {PixelEffect} effect - Transformation applied to each pixel.
             * @returns {void}
             */
            function renderEffect(canvas, image, effect) {
                // Preserve image pixel coordinates; CSS only scales the display.
                canvas.width = image.naturalWidth;
                canvas.height = image.naturalHeight;

                const context = canvas.getContext("2d");
                if (!context) {
                    throw new Error("A 2D canvas context is not available.");
                }

                context.drawImage(image, 0, 0);
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;

                // Each pixel occupies four consecutive values: red, green, blue, alpha.
                // Uint8ClampedArray rounds and clamps channel assignments to 0-255.
                for (let offset = 0; offset < data.length; offset += 4) {
                    effect(data, offset);
                }

                context.putImageData(imageData, 0, 0);
            }

            /**
             * Adds a fixed amount to each color channel; use a negative amount to darken.
             * @param {Uint8ClampedArray} data - Image pixel data.
             * @param {number} offset - Red channel index.
             * @returns {void}
             */
            function brighten(data, offset) {
                const brightness = 40; // Adding 255 would turn every RGB channel white.
                data[offset] += brightness;
                data[offset + 1] += brightness;
                data[offset + 2] += brightness;
            }

            /**
             * Approximates grayscale with weights reflecting sensitivity to RGB channels.
             * This classroom formula works on encoded RGB, not linear-light luminance.
             * @param {Uint8ClampedArray} data - Image pixel data.
             * @param {number} offset - Red channel index.
             * @returns {void}
             */
            function weightedGrayscale(data, offset) {
                const gray = 0.299 * data[offset]
                    + 0.587 * data[offset + 1]
                    + 0.114 * data[offset + 2];
                data[offset] = gray;
                data[offset + 1] = gray;
                data[offset + 2] = gray;
            }

            /**
             * Keeps only the red channel.
             * @param {Uint8ClampedArray} data - Image pixel data.
             * @param {number} offset - Red channel index.
             * @returns {void}
             */
            function keepRed(data, offset) {
                data[offset + 1] = 0;
                data[offset + 2] = 0;
            }

            /**
             * Inverts the three color channels.
             * @param {Uint8ClampedArray} data - Image pixel data.
             * @param {number} offset - Red channel index.
             * @returns {void}
             */
            function invertColors(data, offset) {
                data[offset] = 255 - data[offset];
                data[offset + 1] = 255 - data[offset + 1];
                data[offset + 2] = 255 - data[offset + 2];
            }

            /**
             * Gives each color channel equal weight when computing grayscale.
             * @param {Uint8ClampedArray} data - Image pixel data.
             * @param {number} offset - Red channel index.
             * @returns {void}
             */
            function averageGrayscale(data, offset) {
                const gray = (data[offset] + data[offset + 1] + data[offset + 2]) / 3;
                data[offset] = gray;
                data[offset + 1] = gray;
                data[offset + 2] = gray;
            }

            /**
             * Converts pixels to black or white using their average RGB value.
             * @param {Uint8ClampedArray} data - Image pixel data.
             * @param {number} offset - Red channel index.
             * @returns {void}
             */
            function threshold(data, offset) {
                const cutoff = 60;
                const average = (data[offset] + data[offset + 1] + data[offset + 2]) / 3;
                const value = average >= cutoff ? 255 : 0;
                data[offset] = value;
                data[offset + 1] = value;
                data[offset + 2] = value;
            }

            /**
             * Applies sepia weights using the original RGB values for every channel.
             * @param {Uint8ClampedArray} data - Image pixel data.
             * @param {number} offset - Red channel index.
             * @returns {void}
             */
            function sepia(data, offset) {
                const red = data[offset];
                const green = data[offset + 1];
                const blue = data[offset + 2];
                data[offset] = 0.393 * red + 0.769 * green + 0.189 * blue;
                data[offset + 1] = 0.349 * red + 0.686 * green + 0.168 * blue;
                data[offset + 2] = 0.272 * red + 0.534 * green + 0.131 * blue;
            }
        </script>
    </body>
</html>
