<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Loading an image with a Promise</title>
    </head>
    <body>
        <canvas
            id="canvas"
            style="border: 1px solid;">
        </canvas>

        <script>
            const canvas = document.getElementById("canvas");
            const context = canvas.getContext("2d");

            function loadImage(src) {
                return new Promise((resolve, reject) => {
                    const img = new Image();

                    // Use events to resolve or reject the Promise.
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error(`Could not load the image: ${src}`));

                    // Start loading after registering the handlers.
                    img.src = src;
                });
            }

            loadImage("photo-935x702.jpg")
                .then(img => {
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    context.drawImage(img, 0, 0);
                })
                .catch(error => {
                    console.error(error);
                }); 
        </script>
    </body>
</html>
